server {
    listen 80;
    server_name cotasinteligentes.morpho3d.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cotasinteligentes.morpho3d.com;

    ssl_certificate /etc/letsencrypt/live/cotasinteligentes.morpho3d.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cotasinteligentes.morpho3d.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
